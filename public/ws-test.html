<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>NexusTrade WS Test</title>
<style>
  body { font-family: ui-monospace, monospace; background: #0b0e14; color: #c8d1e0; padding: 20px; margin: 0; }
  h1 { color: #6cf; margin: 0 0 10px; }
  .row { display: flex; gap: 8px; margin: 8px 0; flex-wrap: wrap; }
  button { background: #1a2030; color: #c8d1e0; border: 1px solid #2a3550; padding: 6px 12px; cursor: pointer; border-radius: 4px; font-family: inherit; }
  button:hover { background: #243050; }
  button.danger { border-color: #c44; color: #faa; }
  input { background: #0e1320; color: #c8d1e0; border: 1px solid #2a3550; padding: 6px 10px; border-radius: 4px; font-family: inherit; }
  #status { padding: 6px 12px; border-radius: 4px; display: inline-block; }
  .ok { background: #143; color: #afa; }
  .err { background: #411; color: #faa; }
  #log { background: #06080d; padding: 12px; border: 1px solid #2a3550; height: 60vh; overflow: auto; border-radius: 4px; margin-top: 12px; font-size: 12px; line-height: 1.5; }
  .log-out { color: #6cf; }
  .log-in  { color: #aea; }
  .log-err { color: #faa; }
  .log-sys { color: #888; }
  .stream-key { color: #fc6; font-weight: bold; }
  .price { color: #fff; font-weight: bold; }
</style>
</head>
<body>

<h1>NexusTrade WS Test</h1>
<div class="row">
  <span id="status" class="err">Disconnected</span>
  <button onclick="connect()">Connect</button>
  <button class="danger" onclick="disconnect()">Disconnect</button>
  <button onclick="ping()">Ping</button>
</div>

<div class="row">
  <input id="symbol"   value="BTCUSDT" placeholder="Symbol">
  <input id="interval" value="1m"      placeholder="Interval (1m, 5m, 1h)">
  <button onclick="subKline()">Subscribe Kline</button>
  <button onclick="subTrades()">Subscribe Trades</button>
  <button onclick="subDepth()">Subscribe Depth</button>
  <button onclick="subTicker()">Mini Ticker All</button>
  <button class="danger" onclick="clearLog()">Clear</button>
</div>

<div id="log"></div>

<script>
let ws = null;

const $log    = document.getElementById('log');
const $status = document.getElementById('status');

function logLine(text, cls = 'log-sys') {
  const time = new Date().toLocaleTimeString('tr-TR', { hour12: false });
  const div = document.createElement('div');
  div.className = cls;
  div.innerHTML = `[${time}] ${text}`;
  $log.appendChild(div);
  $log.scrollTop = $log.scrollHeight;
  // En çok 500 satır tutalım
  while ($log.children.length > 500) $log.removeChild($log.firstChild);
}

function setStatus(ok, text) {
  $status.className = ok ? 'ok' : 'err';
  $status.textContent = text;
}

function send(obj) {
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    logLine('Önce bağlanın!', 'log-err');
    return;
  }
  ws.send(JSON.stringify(obj));
  logLine('→ ' + JSON.stringify(obj), 'log-out');
}

function connect() {
  if (ws && ws.readyState === WebSocket.OPEN) return;
  const url = `ws://${location.host}/ws`;
  logLine(`Bağlanıyor: ${url}`);
  ws = new WebSocket(url);
  ws.onopen = () => setStatus(true, 'Connected');
  ws.onclose = () => setStatus(false, 'Disconnected');
  ws.onerror = e => logLine('WS error', 'log-err');
  ws.onmessage = ev => {
    try {
      const msg = JSON.parse(ev.data);
      if (msg.type === 'stream') {
        // Kline stream güzel formatla
        if (msg.data?.e === 'kline') {
          const k = msg.data.k;
          const closed = k.x ? '[CLOSED]' : '[live]';
          logLine(
            `<span class="stream-key">${msg.stream}</span> ${closed} ` +
            `O:${k.o} H:${k.h} L:${k.l} <span class="price">C:${k.c}</span> V:${(+k.v).toFixed(2)}`,
            'log-in'
          );
        } else if (msg.data?.e === 'trade') {
          const d = msg.data;
          const side = d.m ? 'SELL' : 'BUY';
          logLine(
            `<span class="stream-key">${msg.stream}</span> ${side} ` +
            `<span class="price">${d.p}</span> qty:${d.q}`,
            'log-in'
          );
        } else if (msg.data?.bids) {
          const bid = msg.data.bids?.[0];
          const ask = msg.data.asks?.[0];
          logLine(
            `<span class="stream-key">${msg.stream}</span> ` +
            `bid: ${bid?.[0]} (${bid?.[1]}) | ask: ${ask?.[0]} (${ask?.[1]})`,
            'log-in'
          );
        } else {
          logLine(`<span class="stream-key">${msg.stream}</span> ${JSON.stringify(msg.data).slice(0, 200)}`, 'log-in');
        }
      } else {
        logLine('← ' + JSON.stringify(msg), 'log-in');
      }
    } catch {
      logLine('← ' + ev.data, 'log-in');
    }
  };
}

function disconnect() {
  if (ws) ws.close();
}

function ping()      { send({ type:'ping' }); }
function subKline()  {
  const symbol = document.getElementById('symbol').value.trim().toUpperCase();
  const interval = document.getElementById('interval').value.trim();
  send({ type:'subscribe_kline', payload: { symbol, interval } });
}
function subTrades() {
  const symbol = document.getElementById('symbol').value.trim().toUpperCase();
  send({ type:'subscribe_trades', payload: { symbol } });
}
function subDepth()  {
  const symbol = document.getElementById('symbol').value.trim().toUpperCase();
  send({ type:'subscribe_depth', payload: { symbol } });
}
function subTicker() { send({ type:'subscribe_ticker' }); }
function clearLog()  { $log.innerHTML = ''; }
</script>

</body>
</html>
